name: Post welcome comment

on:
  pull_request_target:
    types:
      - opened

permissions:
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Add welcome comment
        run: gh pr comment "$PR_URL" --body "Welcome to the repository! 🎉"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
